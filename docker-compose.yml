# Vidood Stream — one-command run: `docker compose up -d --build`
# Everything (frontend, API, database, media) runs in one container.
services:
  web:
    build:
      context: .
    image: vidood
    restart: unless-stopped
    ports:
      - "80:8787"
    environment:
      PORT: 8787
      COOKIE_SECURE: "1"          # set 0 if not behind HTTPS
      DATA_DIR: /app/data
      STORAGE_DIR: /app/storage
    volumes:
      - vidood-data:/app/data
      - vidood-storage:/app/storage

volumes:
  vidood-data:
  vidood-storage:

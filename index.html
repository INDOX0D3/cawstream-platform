<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Static fallback; replaced at runtime with the site title from
       Admin → Branding. Defaults to the site brand so the tab never flashes
       a stale default name while the app (and its settings) are loading. -->
  <title>Vidood Stream</title>
  <meta
    name="description"
    content="Upload, host and stream videos with a custom player, embed codes, play-button link previews and honest analytics."
  />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vidood Stream" />
  <meta property="og:title" content="Vidood Stream" />
  <meta
    property="og:description"
    content="Upload, host and stream videos with a custom player, embed codes, play-button link previews and honest analytics."
  />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Vidood Stream" />
  <meta
    name="twitter:description"
    content="Upload, host and stream videos with a custom player, embed codes, play-button link previews and honest analytics."
  />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

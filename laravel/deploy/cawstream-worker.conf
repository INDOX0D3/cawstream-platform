; CawStream queue worker (Supervisor alternative to systemd).
;
; Install with:
;   sudo cp deploy/cawstream-worker.conf /etc/supervisor/conf.d/cawstream-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update

[program:cawstream-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/cawstream/artisan queue:work --sleep=3 --tries=3 --timeout=7200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/cawstream-worker.log
stopwaitsecs=3600

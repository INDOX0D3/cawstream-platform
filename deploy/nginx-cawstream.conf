# CawStream — pure static site, no PHP, no backend.
# Place at /etc/nginx/sites-available/vidood and symlink to sites-enabled.
#
#   sudo ln -s /etc/nginx/sites-available/vidood /etc/nginx/sites-enabled/vidood
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name vidood.fun www.vidood.fun;

    # App root: the built static files live in /var/www/vidood
    root /var/www/vidood;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Videos: allow range requests (required for seeking) + long cache
    location /videos/ {
        add_header Cache-Control "public, max-age=604800";
        # mp4/webm range support (nginx handles ranges by default; keep the header)
        add_header Accept-Ranges bytes;
    }

    # Static data JSON — no cache so catalog edits show instantly
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /watch/x, /e/x, /admin all serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}


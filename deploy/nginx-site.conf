# CawStream — nginx site config (bare-metal VPS, no Docker).
#
# 1. Copy this file to /etc/nginx/sites-available/cawstream and replace
#    example.com with your domain.
# 2. ln -s /etc/nginx/sites-available/cawstream /etc/nginx/sites-enabled/
# 3. Place the built app at /var/www/cawstream (the dist/ folder).
# 4. nginx -t && systemctl reload nginx
# 5. sudo certbot --nginx -d example.com   (HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name example.com;          # ← ganti dengan domain Anda

    root /var/www/cawstream;
    index index.html;

    # Video uploads go straight to Convex storage from the browser, so the
    # default client_max_body_size is fine — no need to raise it here.

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# CawStream — nginx site config (bare-metal VPS, no Docker).
#
# 1. Copy this file to /etc/nginx/sites-available/cawstream and replace
#    example.com with your domain.
# 2. ln -s /etc/nginx/sites-available/cawstream /etc/nginx/sites-enabled/
# 3. Place the built app at /var/www/cawstream (the dist/ folder).
# 4. nginx -t && systemctl reload nginx
# 5. sudo certbot --nginx -d example.com   (HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name example.com;          # ← ganti dengan domain Anda

    root /var/www/cawstream;
    index index.html;

    # Video uploads go straight to Convex storage from the browser, so the
    # default client_max_body_size is fine — no need to raise it here.

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # OPSIONAL — hanya aktifkan kalau CONVEX_SITE_URL di dashboard Convex
    # kamu diisi DOMAIN VPS ini (bukan site URL Convex).
    #
    # Backend Convex memanggil `${CONVEX_SITE_URL}/api/send-otp` untuk kirim
    # OTP dan fetch `${CONVEX_SITE_URL}/.well-known/openid-configuration`
    # untuk validasi token login. Kalau domain VPS dipakai, kedua path ini
    # HARUS diproksi ke **site URL** Convex (bentuknya .convex.site), kalau
    # tidak sign-in stuck tanpa error (SPA fallback membalas index.html).
    #
    # Cara paling sederhana & disarankan: JANGAN set CONVEX_SITE_URL — Convex
    # otomatis memakai https://<deployment>.convex.site dan semuanya jalan.
    # Hanya aktifkan blok ini kalau kamu sengaja memakai domain VPS sebagai
    # site URL (perlu domain itu di-set juga di dashboard Convex → Site URL).
    #
    # location /api/ {
    #     proxy_pass https://nama-hewan-123.convex.site;
    #     proxy_set_header Host nama-hewan-123.convex.site;
    # }
    # location = /.well-known/openid-configuration {
    #     proxy_pass https://nama-hewan-123.convex.site;
    #     proxy_set_header Host nama-hewan-123.convex.site;
    # }
    # ------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

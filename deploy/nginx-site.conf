# Vidood Stream — nginx site config (bare-metal VPS, no Docker).
#
# The self-hosted backend (bun run server/index.ts, port 8787) serves the
# built frontend (dist/), the JSON API (/api), and video media (/media) with
# HTTP Range support. nginx only reverse-proxies everything to it.
#
# 1. Copy this file to /etc/nginx/sites-available/vidood and replace
#    example.com with your domain.
# 2. ln -s /etc/nginx/sites-available/vidood /etc/nginx/sites-enabled/
# 3. Build the app and copy dist/ + server/ into the deploy folder
#    (e.g. /opt/vidood). Run the server with systemd (see DEPLOY.md).
# 4. nginx -t && systemctl reload nginx
# 5. sudo certbot --nginx -d example.com   (HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name example.com;          # ← ganti dengan domain Anda

    # Video uploads stream straight to the backend through nginx — allow big
    # bodies (0 = unlimited; or set a cap like 4G).
    client_max_body_size 0;

    # Backend (Bun server: static SPA + JSON API + media with Range support).
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for video seeking (HTTP Range requests).
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

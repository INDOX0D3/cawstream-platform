# CawStream nginx site (installed by install.sh, __APP_DIR__ / __MAX_UPLOAD_SIZE__ are substituted)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root __APP_DIR__/public;
    index index.php;

    client_max_body_size __MAX_UPLOAD_SIZE__;
    client_body_timeout 600s;

    charset utf-8;
    server_tokens off;

    # Never serve these paths.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ ^/(\.env|composer\.json|composer\.lock|artisan|storage/framework|storage/logs|storage/app/videos|\.git) {
        deny all;
        return 404;
    }

    # Thumbnails (long cache).
    location ~ ^/video/[A-Z0-9]+/thumb\.jpg$ {
        try_files $uri @laravel;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Video streaming: stream straight through without buffering so range
    # requests and seeking work with large files.
    location ~ ^/video/ {
        try_files $uri @laravel;
        fastcgi_buffering off;
        fastcgi_read_timeout 7200s;
        proxy_request_buffering off;
    }

    location @laravel {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME __APP_DIR__/public/index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # Long-lived assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
